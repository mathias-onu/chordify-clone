<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretline</title>
<link rel="icon" href="data:,">
<script>
(() => {
  let saved = null;
  try { saved = localStorage.getItem('tabplayer.theme'); } catch {}
  document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./">
    <svg class="logo" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
      <rect x="1" y="1" width="26" height="26" rx="7" fill="var(--ink)"/>
      <g stroke="var(--panel)" stroke-width="1">
        <line x1="6" y1="6.5" x2="22" y2="6.5"/>
        <line x1="6" y1="9.5" x2="22" y2="9.5"/>
        <line x1="6" y1="12.5" x2="22" y2="12.5"/>
        <line x1="6" y1="15.5" x2="22" y2="15.5"/>
        <line x1="6" y1="18.5" x2="22" y2="18.5"/>
        <line x1="6" y1="21.5" x2="22" y2="21.5"/>
      </g>
      <rect x="17" y="4" width="2" height="20" rx="1" fill="var(--accent)"/>
    </svg>
    <span class="wordmark">Fretline</span>
  </a>
  <span id="nav-title" class="nav-title"></span>
  <div class="nav-actions">
    <div class="mode" role="group" aria-label="Tab version">
      <button type="button" data-mode="played">Tab 1 as played</button>
      <button type="button" data-mode="movable">Tab 2 movable shapes</button>
    </div>
    <button type="button" id="open-files" class="open">Open PDF + audio</button>
    <input id="file-input" type="file" multiple accept=".pdf,application/pdf,audio/*,.mp3,.m4a,.wav" hidden>
    <button type="button" id="theme" class="theme" aria-label="Switch to dark theme" title="Theme (D)">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
      </svg>
    </button>
  </div>
</header>
<nav id="songs" class="songs" aria-label="Songs"></nav>
<main id="main" class="main">
  <header class="song-head">
    <h1 id="title"></h1>
    <p id="meta" class="meta"></p>
    <details class="notes">
      <summary>Notes</summary>
      <div id="notes"></div>
    </details>
    <div id="shapes" class="shapes"></div>
  </header>
  <section id="sync" class="sync" aria-label="Sync" hidden>
    <div class="sync-row">
      <label>BPM <input id="sync-bpm" type="number" min="20" max="300" step="0.1" value="120"></label>
      <label>Beats per bar <input id="sync-beats" type="number" min="1" step="1" value="4"></label>
      <label>Bars per line <input id="sync-bars" type="number" min="1" step="1" value="4"></label>
      <label>Lines per page <input id="sync-lines" type="number" min="1" step="1" value="6"></label>
      <label>First bar (s) <input id="sync-first" type="number" min="0" step="0.01" value="0"></label>
      <button type="button" id="sync-now" title="Set first bar to the current time (T)">Set to now</button>
    </div>
    <div class="sync-row">
      <button type="button" id="sync-tap" class="toggle" aria-pressed="false" title="Tap each line start (T)">Tap lines</button>
      <button type="button" id="sync-clear">Clear taps</button>
      <ol id="sync-taps" class="taps"></ol>
    </div>
    <p id="notice" class="notice"></p>
  </section>
  <div id="tab" class="tab"></div>
  <div id="pages" class="pages" hidden></div>
</main>
<footer class="player">
  <button type="button" id="play" class="play" aria-label="Play"></button>
  <button type="button" id="back" title="Back 5s (Left)">−5s</button>
  <button type="button" id="fwd" title="Forward 5s (Right)">+5s</button>
  <button type="button" id="prev" title="Previous section (Shift+Left)">‹ Section</button>
  <button type="button" id="restart" title="Restart section">↺ Section</button>
  <button type="button" id="next" title="Next section (Shift+Right)">Section ›</button>
  <button type="button" id="loop" class="toggle" title="Loop section (L)">Loop</button>
  <select id="rate" aria-label="Speed">
    <option value="0.6">0.6×</option>
    <option value="0.75">0.75×</option>
    <option value="0.9">0.9×</option>
    <option value="1">1.0×</option>
  </select>
  <input id="seek" class="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek">
  <span id="time" class="time">0:00 / 0:00</span>
  <button type="button" id="guitar" class="toggle" title="Guitar on/off (G)">Guitar</button>
  <button type="button" id="autoscroll" class="toggle" title="Autoscroll (A)">Autoscroll</button>
</footer>
<audio id="audio" preload="auto"></audio>
<audio id="audio-noguitar" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
